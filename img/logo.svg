<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- ArangoDB logo inspired design -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient)" stroke="#333" stroke-width="2"/>
  
  <!-- Database symbol -->
  <ellipse cx="50" cy="35" rx="20" ry="6" fill="white" opacity="0.9"/>
  <ellipse cx="50" cy="50" rx="20" ry="6" fill="white" opacity="0.7"/>
  <ellipse cx="50" cy="65" rx="20" ry="6" fill="white" opacity="0.5"/>
  
  <!-- Connection lines representing graph connections -->
  <line x1="30" y1="35" x2="45" y2="45" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="35" x2="55" y2="45" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="55" x2="30" y2="65" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="55" y1="55" x2="70" y2="65" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Small nodes -->
  <circle cx="30" cy="35" r="3" fill="white"/>
  <circle cx="70" cy="35" r="3" fill="white"/>
  <circle cx="30" cy="65" r="3" fill="white"/>
  <circle cx="70" cy="65" r="3" fill="white"/>
</svg>
